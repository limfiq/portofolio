name: Daily Job Scraping Cron

on:
  schedule:
    # Runs every day at 17:00 UTC (00:00 WIB)
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      custom_domain:
        description: 'Optional domain override (e.g. https://yourdomain.com)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scraper Endpoint
        run: |
          # Retrieve domain from manual input or repository secret
          RAW_DOMAIN="${{ github.event.inputs.custom_domain || secrets.APP_DOMAIN }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"
          
          if [ -z "$RAW_DOMAIN" ]; then
            echo "::error::APP_DOMAIN secret is not set in GitHub Repository Secrets. Please configure APP_DOMAIN in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          
          # Clean whitespace
          DOMAIN=$(echo "$RAW_DOMAIN" | xargs)
          
          # Add https:// prefix if missing
          if [[ ! "$DOMAIN" =~ ^https?:// ]]; then
            DOMAIN="https://$DOMAIN"
          fi
          
          # Strip trailing slash
          DOMAIN="${DOMAIN%/}"
          
          ENDPOINT="$DOMAIN/api/loker/scrape"
          echo "Target endpoint: $ENDPOINT"
          
          # Execute curl with timeout and capture response & status code
          AUTH_HEADER=""
          if [ -n "$CRON_SECRET" ]; then
            echo "Using Authorization Bearer token (CRON_SECRET is configured)"
            AUTH_HEADER="-H \"Authorization: Bearer $CRON_SECRET\""
          else
            echo "No CRON_SECRET configured, sending request without auth header"
          fi
          
          RESPONSE_FILE=$(mktemp)
          HTTP_STATUS=$(curl -sS -X GET "$ENDPOINT" \
            ${CRON_SECRET:+-H "Authorization: Bearer $CRON_SECRET"} \
            -H "User-Agent: GitHub-Actions-Cron/1.0" \
            --connect-timeout 15 \
            --max-time 60 \
            -w "%{http_code}" \
            -o "$RESPONSE_FILE" || echo "CURL_FAILED")
          
          echo "=========================================="
          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Response Body:"
          cat "$RESPONSE_FILE"
          echo ""
          echo "=========================================="
          
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
            echo "Scraping completed successfully!"
            exit 0
          elif [ "$HTTP_STATUS" = "CURL_FAILED" ]; then
            echo "::error::Curl command failed to connect to $ENDPOINT. Check if domain/SSL is reachable."
            exit 1
          elif [ "$HTTP_STATUS" = "401" ]; then
            echo "::error::Unauthorized (401). CRON_SECRET in GitHub Secrets does not match CRON_SECRET in your Vercel/Server environment."
            exit 1
          else
            echo "::error::Scraper endpoint returned non-OK status: $HTTP_STATUS"
            exit 1
          fi

